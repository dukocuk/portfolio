# nginx server block for whoisduran.com.
#
# Lives in the repo so it can't drift from the build that assumes it — the
# index.html fallback below is a direct consequence of this being a router-less
# SPA, and the /assets/ cache policy of Vite's content-hashed filenames.
#
# Install by *replacing* any existing whoisduran server block, wherever it lives —
# find it with `grep -rl whoisduran.com /etc/nginx/sites-available/`. (Don't
# `grep -r` inside sites-enabled/: every entry there is a symlink and GNU grep
# skips symlinks while recursing, so it returns a convincing empty result.)
# Leaving an old block in place alongside this file gives two servers claiming
# the same server_name, and nginx quietly serves whichever it loaded first.
#
#   nginx -t && systemctl reload nginx
#
# A reload applies every pending config on this box — it also serves notecast.net,
# vildpluk.dk and n8n.vildpluk.dk — so check those after reloading.
#
# HTTP/2 is deliberately not enabled: Cloudflare speaks HTTP/1.1 to origins by
# default, so it would buy nothing and `http2 on;` needs nginx 1.25.1+ (this box
# runs 1.24).
#
# The site is fronted by Cloudflare, which terminates TLS for visitors; the
# certificate below is the Cloudflare origin cert.

server {
    listen 80;
    listen [::]:80;
    server_name whoisduran.com www.whoisduran.com;
    return 301 https://whoisduran.com$request_uri;
}

# www -> apex, so every page has exactly one address. Without this both
# hostnames serve 200 and search engines pick a canonical for us.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.whoisduran.com;

    ssl_certificate     /etc/nginx/ssl/whoisduran.crt;
    ssl_certificate_key /etc/nginx/ssl/whoisduran.key;

    return 301 https://whoisduran.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name whoisduran.com;

    ssl_certificate     /etc/nginx/ssl/whoisduran.crt;
    ssl_certificate_key /etc/nginx/ssl/whoisduran.key;

    root /var/www/whoisduran/dist;
    index index.html;

    # Cloudflare terminates TLS in front of us, so nginx sees plain HTTP and
    # would otherwise build its redirects with the wrong scheme. Relative
    # Location headers sidestep the problem entirely.
    absolute_redirect off;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Vite hashes every filename in here — JS, CSS and the generated WebP
    # case-study variants alike — so they can never go stale.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Stable names whose contents do change from one deploy to the next.
    location = /sitemap.xml   { add_header Cache-Control "public, max-age=3600"; }
    location = /robots.txt    { add_header Cache-Control "public, max-age=3600"; }
    location = /og-image.png  { add_header Cache-Control "public, max-age=86400"; }

    location / {
        # HTML has to revalidate, or a deploy takes a day to become visible.
        add_header Cache-Control "public, max-age=0, must-revalidate";
        # Router-less SPA: there is exactly one HTML document, and anything that
        # isn't a real file is its problem, not nginx's. Hence the fallback to
        # /index.html rather than a 404 page.
        try_files $uri $uri/ /index.html;
    }
}
